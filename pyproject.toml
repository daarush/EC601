[project]
name = "web-fuzz-compare"
version = "0.1.0"
description = "AI-assisted web fuzzing: mutation vs ML vs LLM comparison"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "flask>=3.0",
    "scikit-learn>=1.4",
    "openai>=1.30",
    "click>=8.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]